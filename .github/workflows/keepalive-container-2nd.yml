name: keepalive-container-2nd
# 2号机（QwenPaw 阿里云容器）40 小时保活机制
# 目的：容器 48h 无活动自动睡眠 → 本 workflow 每 25 分钟探测并访问容器隧道（2nd= 槽位），
#       使容器保持"活动"状态，实现 40 小时及以上持续在线；同时做健康巡检并留档。
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: 探测2号机容器隧道并保持活动
        id: probe
        run: |
          BOARD="https://1759717772.github.io/dept-cloud-addr/addr.txt"
          RAW=$(curl -sL --max-time 15 "$BOARD" 2>/dev/null || true)
          [ -z "$RAW" ] && RAW=$(curl -sL --max-time 15 "https://raw.githubusercontent.com/1759717772/dept-cloud-addr/main/addr.txt?ts=$(date +%s)" 2>/dev/null || true)
          URL=$(printf '%s' "$RAW" | grep '^2nd=' | cut -d= -f2- | tr -d ' \r\n')
          VER=$(printf '%s' "$RAW" | grep '^version=' | cut -d= -f2- | tr -d ' \r\n')
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          echo "board_ver=${VER:-unknown}" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "公告牌无 2nd= 地址（2号机容器隧道未登记）"
            echo "status=no_addr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # 保持活动：访问 /api/version（容器有流量即算活动）
          CODE=""
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$URL/api/version" || true)
            [ "$CODE" = "200" ] && break
            sleep 3
          done
          echo "code=${CODE:-000}" >> "$GITHUB_OUTPUT"
          echo "HTTP $CODE  $URL/api/version"
          # 备用：访问首页
          if [ "$CODE" != "200" ]; then
            CODE2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$URL" || true)
            echo "首页 HTTP $CODE2"
          fi

      - name: 写状态并提交
        run: |
          NOW="${{ steps.probe.outputs.now }}"
          URL="${{ steps.probe.outputs.url }}"
          CODE="${{ steps.probe.outputs.code }}"
          VER="${{ steps.probe.outputs.board_ver }}"
          # 追加到保活日志（仅保留最近 200 条）
          LOG="keepalive-2nd.log"
          touch "$LOG"
          tail -199 "$LOG" > "$LOG.tmp" 2>/dev/null || true
          printf '%s | code=%s | ver=%s | %s\n' "$NOW" "$CODE" "$VER" "$URL" >> "$LOG.tmp"
          mv "$LOG.tmp" "$LOG"
          python3 - "$CODE" <<'EOF'
import json, sys, os
code = sys.argv[1]
p = 'status-2nd.json'
d = {}
if os.path.exists(p):
    try: d = json.load(open(p))
    except Exception: d = {}
d['checked_at'] = os.environ.get('NOW','')
d['last_code'] = code
d['url'] = os.environ.get('URL','')
d['version'] = os.environ.get('VER','')
json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)
EOF
          git config user.name "dept-cloud-keepalive"
          git config user.email "dept-cloud@users.noreply.github.com"
          git add "$LOG" status-2nd.json
          git commit -m "keepalive-2nd $NOW code=$CODE" --quiet || echo "无变化"
          git pull --rebase origin main --quiet 2>/dev/null || true
          git push origin main --quiet || echo "push 失败（下次重试）"
